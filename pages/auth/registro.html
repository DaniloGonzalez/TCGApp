<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TCG App</title>
    <link rel="stylesheet" href="../../css/stylesheet.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="../torneos/torneos.html">Torneos</a></li>
                <li><a href="../ranking/ranking.html">Ranking</a></li>
                <li><a href="login.html">Iniciar sesion</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero-content">
            <h1 class="hero-title">Crear una cuenta</h1>
            <p class="hero-text">Regístrate en TCG App para participar en torneos y consultar tus resultados.</p>
        </div>

        <div class="login-content">
            <h2>Registro</h2>

            <form id="registro-form">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" required>

                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" required>

                <button type="submit" class="main-button">Registrarse</button>

                <p id="registro-message"></p>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TCG App. Todos los derechos reservados. Proyecto TCG App</p>
    </footer>

    <script src="../../js/script.js"></script>
</body>
</html>
